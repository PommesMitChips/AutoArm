[AutoArm]
Arm=Arm 1
Format=4

[Config]
;HEAD=head, HRZ=cockpit side, VRT=cockpit top/bottom. Reload applies defaults.
MovementMode=HEAD
;Head translation m/s; 0..5
HeadSpeed=0.2
;Head rotation deg/s; 0.01..30
HeadTurnSpeed=5
;Toolbar step deg; 0.01..180
StepAngle=5
;Rotor/hinge RPM cap; 0.01..5
JointSpeed=0.5
;Piston m/s cap; 0.01..2
PistonSpeed=0.2
;Home RPM cap; 0.01..5
HomeJointSpeed=0.5
;Home m/s cap; 0.01..2
HomePistonSpeed=0.2
;Idle orientation band deg; 0..30
OrientationTolerance=3
;Rotor RPM/s cap; 0.01..20
JointAcceleration=1
;Piston m/s^2 cap; 0.01..10
PistonAcceleration=0.4
;Correction m/s cap; 0..5
PositionCorrectionCap=0.2
;Correction deg/s cap; 0..30
OrientationCorrectionCap=5
;Target lead m; 0.01..10
TargetLead=1.5
;Bias gain 1/s^2; 0=off; 0..5
PositionIntegralGain=0.5
;Angular bias gain 1/s^2; 0=off; 0..5
OrientationIntegralGain=0.25
;Bias m/s cap; 0..5
PositionIntegralCap=0.2
;Bias deg/s cap; 0..30
OrientationIntegralCap=5
;Mouse scale; total rotation capped; 0..10
MouseSensitivity=0.025
;Game movement input.
ReadKeyboard=true
;Q/E: Head roll.
ReadRoll=true
;Optional view pitch/yaw.
ReadMouse=false
;Edit only the two weights (0..10), then Reload.
Actuators=
|Name | Kind | Translation | Orientation
|01. Arm 1 - Base | Rotor/Hinge | 1 | 1
|02. Hinge | Rotor/Hinge | 1 | 1
|03. Advanced Rotor | Rotor/Hinge | 1 | 1
|04. Hinge | Rotor/Hinge | 1 | 1
|05. Advanced Rotor | Rotor/Hinge | 1 | 1
|06. Hinge | Rotor/Hinge | 1 | 1
|07. Advanced Rotor | Rotor/Hinge | 1 | 1
|08. Hinge | Rotor/Hinge | 1 | 1
|09. Hinge | Rotor/Hinge | 1 | 1
|10. Advanced Rotor | Rotor/Hinge | 1 | 1

[Instructions]
Setup=
|Edit Config; Reload, Check, On. Base: 'Arm 1 - Base'; Head: 'Arm 1 - Head'.
|Weights 0..10; edit the two weights. Blank Actuators resets.
|Different Format: delete Custom Data. IDs: Info/Joints.
Commands=
|On / Off / Stop / Toggle / Hold / Check / Rescan / Reload
|Info / Help / Settings / Status / Joints / Bindings / Version
|SetHome / GoHome / HomeInfo
|Forward / Back / Left / Right / Up / Down; Face <direction>
|PitchUp / PitchDown / YawLeft / YawRight / RollLeft / RollRight
|Step Yaw|Pitch|Roll <degrees>; Yaw / Pitch / Roll <degrees>
|Mode HEAD|HRZ|VRT; ReadMouse / ReadKeyboard / ReadRoll On|Off|Toggle
|Speed <m/s>; TurnSpeed <deg/s>; StepSize <deg>; JointSpeed <RPM>; PistonSpeed <m/s>
|HomeSpeed <RPM> <m/s>; OrientationTolerance <deg>
|Tool <name/index>; Park [port number]; ToolScan / ToolInfo / SwapCancel
|PivotProbe Start <group>; PivotProbe End / Report / Reset
|Separate commands with ;. Reload restores defaults.
Pose=
|MoveTo x y z; OrientTo fx fy fz ux uy uz; MoveToPosOri x y z fx fy fz ux uy uz.
|Base Forward/Left/Up coordinates; On required; pilot input remains active.
Bindings=
|Toolbar Run: PitchUp Back PitchDown Left Down Right YawLeft Forward YawRight.
|HEAD=head axes; HRZ=cockpit axes; VRT=W/S screen Up/Down, C/Space into/out of view.
|Translation holds orientation; Q/E Head roll; optional mouse view rotation.
|Tool <name> swaps; Park uses ParkMerge; SwapCancel/Stop retains support.

[Tools]
Enabled=false
;Arm-end reference; ToolNN.Mount = exact tool base name.
Mount=
;Exact markers, one per line; ToolNN order. Tool <name/index>; Park [number]; ToolScan; SwapCancel.
Heads=
ScanHeadMerges=true
ScanStandMerges=true
ScanParkMerges=true
ParkMerges=
MergeNormal=Auto
ApproachDistance=0.5
MoveSpeed=0.05
TurnSpeed=2
PositionTolerance=0.005
AngleTolerance=0.2
PhaseTimeout=30
CellLimit=4096
;Fresh bare arm: offset metres Forward/Left/Up | forward | up. Relative to Mount; default Forward/Up.
ArmTip=
