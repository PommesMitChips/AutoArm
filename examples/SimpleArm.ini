;Fresh v2.5 simple-arm setup: edit the programmable block's Custom Data.
;Name only one attached root joint Arm 1 - Base - Rotor (or Piston/Hinge).
;Name only one reference block Arm 1 - Head - Drill.
;Other terminal blocks must not start with Arm 1 - Head.
[AutoArm]
Arm=Arm 1
Format=3

[Config]
MovementMode=HEAD
ReadKeyboard=true
ReadRoll=true
ReadMouse=false
;Fresh setup only. Blanking an existing table resets its weights.
Actuators=

[Tools]
Enabled=false
Mount=
Heads=
