;Fresh v2.5 one-tool automatic park/pickup setup; PB Custom Data.
;Root joint: Arm 1 - Base - Rotor (or Piston/Hinge).
;Separate detachable end rotor/hinge BASE: Arm 1 - ToolMount.
;Tool carries its detachable top, marker and HeadMerge.
;Fixed support merge: Arm 1 - ParkMerge 1, facing the tool merge.
[AutoArm]
Arm=Arm 1
Format=3

[Config]
MovementMode=HEAD
ReadKeyboard=true
ReadRoll=true
ReadMouse=false
Actuators=

[Tools]
Enabled=true
Mount=Arm 1 - ToolMount
Heads=
|Arm 1 - Head 1 - Drill
ScanHeadMerges=false
ScanStandMerges=false
ScanParkMerges=false
ParkMerges=
|Arm 1 - ParkMerge 1
MergeNormal=Auto
ApproachDistance=0.5
MoveSpeed=0.05
TurnSpeed=2
PositionTolerance=0.005
AngleTolerance=0.2
PhaseTimeout=30
CellLimit=4096

[Tool01]
Name=Head 1
StandPrefix=
HeadMerges=
|Arm 1 - Head 1 - HeadMerge
;Not needed for Park: its destinations are Tools.ParkMerges.
StandMerges=
