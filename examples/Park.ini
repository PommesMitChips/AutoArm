;AutoArm 2.6: PB Custom Data. Start installation with one tool attached.
;Tools.Mount is a reference terminal block that stays on the arm.
;Each ToolNN.Mount is a rotor/hinge BASE carried by that tool.
;The unnamed compatible rotor/hinge TOP stays on the arm.
[AutoArm]
Arm=Arm 1
Format=4

[Config]
MovementMode=HEAD
ReadKeyboard=true
ReadRoll=true
ReadMouse=false
Actuators=

[Tools]
Enabled=true
Mount=Arm 1 - ToolMount
Heads=
|Arm 1 - Head 1 - Drill
ScanHeadMerges=false
ScanStandMerges=false
ScanParkMerges=false
ParkMerges=
|Arm 1 - ParkMerge 1
MergeNormal=Auto
ApproachDistance=0.5
MoveSpeed=0.05
TurnSpeed=2
PositionTolerance=0.005
AngleTolerance=0.2
PhaseTimeout=30
CellLimit=4096

[Tool01]
Name=Head 1
Mount=Arm 1 - Head 1 - Mount
StandPrefix=
HeadMerges=
|Arm 1 - Head 1 - HeadMerge
;Not needed for Park: its destinations are Tools.ParkMerges.
StandMerges=
