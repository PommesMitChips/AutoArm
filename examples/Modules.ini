[AutoArm]
Arm=Arm 1
Format=6

[Modules]
;Leave empty for a simple arm. Otherwise use the exact ToolSwap PB name.
ToolSwapPB=
;Optional additional PBs, one exact name and permission per line. Max 16.
;Observe reads state; Plan submits paths; Stop permits emergency stops.
Peers=
|Arm Planner | Plan
|Arm Monitor | Observe
|Arm Safety | Stop
