;AutoArm 2.7: PB Custom Data. A bare arm can start using the ArmTip setting.
;Tools.Mount is a reference terminal block that stays on the arm.
;Each ToolNN.Mount is a rotor BASE carried by that tool.
;The unnamed compatible rotor TOP stays on the arm.
[AutoArm]
Arm=Arm 1
Format=4

[Config]
MovementMode=HEAD
HeadSpeed=0.2
HeadTurnSpeed=5
ReadKeyboard=true
ReadRoll=true
ReadMouse=false
;Blank generates the current table. Other scalar defaults are generated too.
Actuators=

[Tools]
Enabled=true
Mount=Arm 1 - ToolMount
;For fresh bare startup: offset metres Forward/Left/Up | forward | up.
;Example only: 0 2.5 0 | Forward | Up (top one large-grid cell left).
ArmTip=
;Exact head-marker block names; ToolNN sections follow this order.
Heads=
|Arm 1 - Head 1 - Drill
|Arm 1 - Head 2 - Welder
;Explicit lists below adopt these merges even with automatic scans off.
ScanHeadMerges=false
ScanStandMerges=false
ScanParkMerges=false
;Optional explicit generic park names, one per continuation line.
ParkMerges=
MergeNormal=Auto
ApproachDistance=0.5
MoveSpeed=0.05
TurnSpeed=2
PositionTolerance=0.005
AngleTolerance=0.2
PhaseTimeout=30
CellLimit=4096

[Tool01]
Name=Head 1
Mount=Arm 1 - Head 1 - Mount
StandPrefix=
HeadMerges=
|Arm 1 - Head 1 - HeadMerge
StandMerges=
|Arm 1 - Head 1 - StandMerge

[Tool02]
Name=Head 2
Mount=Arm 1 - Head 2 - Mount
StandPrefix=
HeadMerges=
|Arm 1 - Head 2 - HeadMerge
StandMerges=
|Arm 1 - Head 2 - StandMerge
