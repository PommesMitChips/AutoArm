;Two-tool starter using the screenshot's exact drill/welder/merge names.
;Requires AutoArm 2.5.1. Edit the programmable block's Custom Data, then Reload.
;Mount each new tool once and run ToolScan to learn its unnamed top.
;Unlearned parked profiles do not block manual use of the learned mounted tool.
;The mount is the rotor/hinge BASE, not its detachable top.
[AutoArm]
Arm=Arm 1
Format=3

[Config]
MovementMode=HEAD
HeadSpeed=0.2
HeadTurnSpeed=5
ReadKeyboard=true
ReadRoll=true
ReadMouse=false
;Blank generates the current table. Other scalar defaults are generated too.
Actuators=

[Tools]
Enabled=true
Mount=Arm 1 - ToolMount
;Exact head-marker block names; ToolNN sections follow this order.
Heads=
|Arm 1 - Head 1 - Drill
|Arm 1 - Head 2 - Welder
;Explicit lists below adopt these merges even with automatic scans off.
ScanHeadMerges=false
ScanStandMerges=false
ScanParkMerges=false
;Optional explicit generic park names, one per continuation line.
ParkMerges=
MergeNormal=Auto
ApproachDistance=0.5
MoveSpeed=0.05
TurnSpeed=2
PositionTolerance=0.005
AngleTolerance=0.2
PhaseTimeout=30
CellLimit=4096

[Tool01]
Name=Head 1
StandPrefix=
HeadMerges=
|Arm 1 - Head 1 - HeadMerge
StandMerges=
|Arm 1 - Head 1 - StandMerge

[Tool02]
Name=Head 2
StandPrefix=
HeadMerges=
|Arm 1 - Head 2 - HeadMerge
StandMerges=
|Arm 1 - Head 2 - StandMerge
