[AutoArm]
Arm=Arm 1
Format=2

[Instructions]
Setup=
|Edit Config, then Reload. Reload/Rescan stay Off; Check then On enables control.
|Mark the base 'Arm 1 - Base' and head 'Arm 1 - Head'.
|Weights are solver preferences (0..10), not motion percentages.
|Edit only Translation/Orientation in the table. Blank Actuators resets weights.
|Parallel members share a row. IDs/geometry: Info or Joints.
Commands=
|On / Off / Stop / Toggle / Hold / Check / Rescan / Reload
|Info / Help / Settings / Status / Joints / Bindings / Version
|SetHome / GoHome / HomeInfo
|Face Forward|Back|Left|Right|Up|Down; Step Yaw|Pitch|Roll <degrees>
|Yaw / Pitch / Roll <degrees>; PitchUp / PitchDown / YawLeft / YawRight / RollLeft / RollRight
|Speed <m/s>; TurnSpeed <deg/s>; StepSize <deg>; JointSpeed <RPM>; PistonSpeed <m/s>
|HomeSpeed <RPM> <m/s>; OrientationTolerance <deg>; ReadKeyboard / ReadRoll On|Off|Toggle
|PivotProbe Start <group>; PivotProbe End / Report / Reset
|Separate commands with semicolons. Speed/input commands are temporary; Config persists.
Bindings=
|PB toolbar: Run argument 1..9 uses Config Bind1..Bind9.
|Allowed: None, PitchUp, PitchDown, YawLeft, YawRight, RollLeft, RollRight,
|Forward, Back, Left, Right, Up, Down, On, Off, Stop, Toggle, Hold, SetHome, GoHome, Check, Info, Status.
|Pilot translation and roll follow your Space Engineers controller bindings.

[Config]
;Head translation, m/s; 0..5
HeadSpeed=0.2
;Head rotation, deg/s; 0.01..30
HeadTurnSpeed=5
;Toolbar rotation step, deg; 0.01..180
StepAngle=5
;Rotor/hinge cap, RPM; 0.01..5
JointSpeed=0.5
;Piston cap, m/s; 0.01..2
PistonSpeed=0.2
;Home rotor/hinge cap, RPM; 0.01..5
HomeJointSpeed=0.5
;Home piston cap, m/s; 0.01..2
HomePistonSpeed=0.2
;Idle orientation deadband, deg; 0..30
OrientationTolerance=3
;Rotor/hinge acceleration cap, RPM/s; 0.01..20
JointAcceleration=1
;Piston acceleration cap, m/s^2; 0.01..10
PistonAcceleration=0.4
;Position correction cap, m/s; 0..5
PositionCorrectionCap=0.2
;Orientation correction cap, deg/s; 0..30
OrientationCorrectionCap=5
;Maximum pilot target lead, m; 0.01..10
TargetLead=1.5
;Position load-bias learning gain, 1/s^2 (0 disables); 0..5
PositionIntegralGain=0.5
;Orientation load-bias learning gain, 1/s^2 (0 disables); 0..5
OrientationIntegralGain=0.25
;Position load-bias cap, m/s; also limited by correction cap; 0..5
PositionIntegralCap=0.2
;Orientation load-bias cap, deg/s; also limited by correction/turn caps; 0..30
OrientationIntegralCap=5
;Read ship-controller translation input (game movement bindings).
ReadKeyboard=true
;Read ship-controller roll input (game roll bindings).
ReadRoll=true
;PB toolbar Run arguments 1..9. These do not remap the game's keyboard.
Bind1=PitchUp
Bind2=Back
Bind3=PitchDown
Bind4=Left
Bind5=Down
Bind6=Right
Bind7=YawLeft
Bind8=Forward
Bind9=YawRight
;Edit only the two weights (0..10), then Reload.
Actuators=
|Name | Kind | Translation | Orientation
|01. Arm 1 - Base | Rotor/Hinge | 1 | 1
|02. Hinge | Rotor/Hinge | 1 | 1
|03. Advanced Rotor | Rotor/Hinge | 1 | 1
|04. Hinge | Rotor/Hinge | 1 | 1
|05. Advanced Rotor | Rotor/Hinge | 1 | 1
|06. Hinge | Rotor/Hinge | 1 | 1
|07. Advanced Rotor | Rotor/Hinge | 1 | 1
|08. Hinge | Rotor/Hinge | 1 | 1
|09. Hinge | Rotor/Hinge | 1 | 1
|10. Advanced Rotor | Rotor/Hinge | 1 | 1
