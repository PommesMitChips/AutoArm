;Starter example. Replace names with exact unique block names before Reload.
;The mount is the rotor/hinge BASE, not its detachable top.
[AutoArm]
Arm=Arm 1
Format=3

[Config]
MovementMode=HEAD
HeadSpeed=0.2
HeadTurnSpeed=5
ReadKeyboard=true
ReadRoll=true
ReadMouse=false
;Blank generates the current table. Other scalar defaults are generated too.
Actuators=

[Tools]
Enabled=true
Mount=Arm 1 - ToolMount
;Exact head-marker block names; ToolNN sections follow this order.
Heads=
|Arm 1 - Head 1
|Arm 1 - Head 2
ScanHeadMerges=true
ScanStandMerges=true
ScanParkMerges=true
;Optional explicit generic park names, one per continuation line.
ParkMerges=
MergeNormal=Auto
ApproachDistance=0.5
MoveSpeed=0.05
TurnSpeed=2
PositionTolerance=0.005
AngleTolerance=0.2
PhaseTimeout=30
CellLimit=4096

[Tool01]
Name=Head 1
StandPrefix=Arm 1 - Head 1 - StandMerge 
;Empty lists use the enabled automatic scans.
HeadMerges=
StandMerges=

[Tool02]
Name=Head 2
StandPrefix=Arm 1 - Head 2 - StandMerge 
HeadMerges=
StandMerges=
